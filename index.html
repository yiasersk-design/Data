<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>প্রশ্ন ম্যাচার ও অধ্যায়ভিত্তিক বিশ্লেষণ</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7086;--pri:#4f46e5;--pri2:#7c3aed;--ok:#059669;--warn:#d97706;--bad:#dc2626;--bd:#e5e7f2;--hl:#fff1a8;--sh:0 4px 18px rgba(40,40,90,.08);--r:6px;--soft:#eef0ff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--tx:#eceefb;--mut:#9aa0bd;--bd:#2a2f4a;--hl:#6b5a10;--sh:0 4px 18px rgba(0,0,0,.4);--soft:#222850}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#e5e7eb}
body{font-family:'Noto Sans Bengali','Hind Siliguri','Kalpurush','SolaimanLipi',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;font-size:13.5px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;width:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.12)}

.top{padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:#fff;color:var(--tx);display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:0 0 8px 8px;border-bottom:1px solid var(--bd);box-shadow:var(--sh);z-index:5}
.top h1{margin:0;font-size:16.5px;font-weight:700;line-height:1.35}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap}
.chip.ok{background:#d1fae5;color:#047857}
.chip.busy{background:#fef3c7;color:#b45309}
.chip.bad{background:#fee2e2;color:#b91c1c}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px calc(env(safe-area-inset-bottom) + 72px);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}

.tabs{position:absolute;left:0;right:0;bottom:0;width:100%;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 2px calc(env(safe-area-inset-bottom) + 6px);box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:6}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:10.5px;padding:3px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s ease,transform .15s ease}

.tabs button .ic{display:flex;align-items:center;justify-content:center;height:20px}
.tabs button.on{color:var(--pri);font-weight:700;transform:translateY(-2px)}
.tabs .bdg{position:absolute;top:0;right:18%;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.sic{display:inline-block;vertical-align:middle;flex-shrink:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 12px;margin-bottom:8px;border:1px solid var(--bd)}
.hero{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mut{color:var(--mut)}.small{font-size:12px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--bd), 0 4px 8px rgba(0,0,0,.06);transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s ease,background .2s;position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd), 0 1px 3px rgba(0,0,0,.04)}
.btn.pri{background:linear-gradient(180deg,#6366f1,var(--pri));color:#fff;border:none;box-shadow:0 3.5px 0 #3730a3, 0 5px 12px rgba(79,70,229,.35)}
.btn.pri:active{transform:translateY(3px);box-shadow:0 0.5px 0 #3730a3, 0 2px 4px rgba(79,70,229,.3)}
.btn.dng{background:linear-gradient(180deg,#ef4444,var(--bad));color:#fff;border:none;box-shadow:0 3.5px 0 #991b1b, 0 5px 12px rgba(220,38,38,.35)}
.btn.dng:active{transform:translateY(3px);box-shadow:0 0.5px 0 #991b1b, 0 2px 4px rgba(220,38,38,.3)}
.btn.sm{font-size:12px;padding:4px 9px;border-radius:6px;gap:4px;box-shadow:0 2px 0 var(--bd), 0 2px 4px rgba(0,0,0,.04)}
.btn.sm:active{transform:translateY(2px);box-shadow:0 0 0 var(--bd)}
.btn[disabled]{opacity:.5;pointer-events:none;box-shadow:none;transform:none}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lbl{display:block;font-weight:600;font-size:13px;margin:6px 0 3px}
.inp{width:100%;font:inherit;font-size:14px;padding:7px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:none}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
textarea.inp{resize:vertical;line-height:1.55}
textarea.big{min-height:150px}



.warnbox{background:#fff7e0;color:#8a5a00;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px}
@media(prefers-color-scheme:dark){.warnbox{background:#3a2e0c;color:#f6d98a}}
.book{display:flex;flex-direction:column;gap:4px;padding:6px 10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;transition:box-shadow .2s,border-color .2s}
.book-header{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.file-badge{width:34px;height:34px;min-width:34px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:var(--mut);letter-spacing:0.5px;transition:transform .2s ease}
.book-header:active .file-badge{transform:scale(.92)}
.book-info{flex:1;min-width:0}
.book .bname{font-size:13.5px;font-weight:600;color:var(--tx);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-meta{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-icon-del{background:none;border:none;color:var(--mut);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s}
.btn-icon-del:hover{color:var(--bad);background:rgba(220,38,38,.08)}
.book-tools{display:flex;gap:5px;border-top:1px dashed transparent;padding-top:0;margin-top:0;max-height:0;opacity:0;overflow:hidden;transform:translateY(-6px);transition:max-height .28s cubic-bezier(.34,1.3,.64,1),opacity .22s ease,transform .25s cubic-bezier(.34,1.3,.64,1),padding-top .2s ease,border-color .2s ease;pointer-events:none}
.book.open .book-tools{max-height:45px;opacity:1;transform:translateY(0);border-top-color:var(--bd);padding-top:5px;pointer-events:auto}



.badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:600}
.badge.saved{background:#d1fae5;color:#047857}.badge.review{background:#fef3c7;color:#b45309}.badge.ambiguous{background:#ffedd5;color:#c2410c}.badge.unmatched{background:#fee2e2;color:#b91c1c}.badge.duplicate{background:#e0e7ff;color:#4338ca}
.badge.imp{background:rgba(220,38,38,.12);color:#dc2626;border:1px solid rgba(220,38,38,.3);font-weight:700}
.badge.med{background:rgba(217,119,6,.12);color:#d97706;border:1px solid rgba(217,119,6,.3);font-weight:700}
.badge.low{background:rgba(107,112,134,.12);color:var(--mut);border:1px solid rgba(107,112,134,.25);font-weight:600}


.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.fch{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 2.5px 0 var(--bd), 0 2px 5px rgba(0,0,0,.04);transition:transform .12s ease,box-shadow .12s ease}
.fch:active{transform:translateY(2px);box-shadow:0 0.5px 0 var(--bd)}
.fch.on{background:linear-gradient(180deg,#6366f1,var(--pri));color:#fff;border-color:transparent;box-shadow:0 3px 0 #3730a3, 0 4px 10px rgba(79,70,229,.3)}
.fch.on:active{transform:translateY(2px);box-shadow:0 1px 0 #3730a3}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.qno{font-weight:700;color:var(--pri)}
.qtxt{white-space:pre-wrap;word-break:break-word}
.qchips{margin:4px 0;display:flex;gap:6px;flex-wrap:wrap}
.qchip{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 6px;word-break:break-word}
.cand{border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-top:6px;background:var(--bg)}
.cand.sel{border-color:var(--ok);background:rgba(16,185,129,.08)}
.chead{font-weight:600;font-size:13.5px}.sep{margin:0 5px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.tp,.sc,.cx{font-size:11.5px;padding:0 8px;border-radius:999px;border:1px solid var(--bd)}
.tp.exact{background:#d1fae5;color:#047857;border-color:transparent}.tp.normalized{background:#dbeafe;color:#1d4ed8;border-color:transparent}.tp.partial{background:#fef3c7;color:#b45309;border-color:transparent}.tp.fuzzy{background:#fce7f3;color:#be185d;border-color:transparent}
.ctxt{margin:4px 0;word-break:break-word}.dim{color:var(--mut)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 3px}
.selb{color:var(--ok);font-weight:600;font-size:12.5px}
.bar{height:4px;background:var(--bd);border-radius:4px;overflow:hidden;margin:3px 0 5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
details{margin-top:6px}summary{cursor:pointer;color:var(--pri);font-size:13px}
.rs{display:flex;gap:6px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fld{margin:4px 0;word-break:break-word}.fld b{color:var(--mut);font-weight:600;font-size:12px;display:block}
.ent{border-left:3px solid var(--pri)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;margin:6px 0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;box-shadow:0 2.5px 0 var(--bd), 0 2px 5px rgba(0,0,0,.03)}
.toggle:last-child{border-bottom:1px solid var(--bd)}
.toggle select{font:inherit;padding:6px 10px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--tx);box-shadow:0 2px 0 var(--bd);cursor:pointer;outline:none}
.toggle select:active{transform:translateY(1px);box-shadow:0 1px 0 var(--bd)}
.toggle input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);cursor:pointer;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.empty{text-align:center;padding:22px 10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:6px}
.mback{position:fixed;inset:0;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}
.modal{background:var(--card);width:100%;max-width:480px;max-height:85vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:su .28s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.modal.wide{max-width:480px}

.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px}
.x{border:0;background:var(--soft);color:var(--tx);width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}
.mbody{padding:4px 14px 10px;overflow-y:auto;word-break:break-word}
.mfoot{display:flex;gap:6px;justify-content:flex-end;padding:8px 14px calc(env(safe-area-inset-bottom) + 12px);flex-wrap:wrap}
.chrow{display:flex;gap:6px;align-items:center;margin:5px 0}.chrow .inp{flex:1}
.radio{display:block;margin:4px 0}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%}
.tst{background:#1f2237;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--sh);animation:su .3s cubic-bezier(.34,1.56,.64,1);max-width:100%}
.tst.bad{background:var(--bad)}.tst.ok{background:var(--ok)}
.busy{position:fixed;inset:0;background:rgba(10,12,30,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:90;color:#fff}
.busy.on{display:flex}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 1s linear infinite}
pre.tx{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:6px;max-height:50vh;overflow:auto;font-family:inherit;font-size:13px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script id="engine">
/* ================= ENGINE : বাংলা টেক্সট ম্যাচিং ================= */
const ENGINE_V = 1;
const PUNCT_RE = /[।॥!?,.;:"'“”‘’«»()\[\]{}<>\-–—…_*#\/\\|~`^=+@$%&]/g;
const STOPQ = new Set(['প্রশ্ন','কোন','কোনো','কোথা','কোথায়','কোথাকার','কী','কি','কে','কার','কাকে','কেন','অধ্যায়','অধ্যায়ের','থেকে','নেওয়া','নেয়া','হয়েছে','লাইনটি','লাইন','বাক্যটি','বাক্য','উৎস','উক্তিটি','উক্তি','অংশটি','অংশ','এই','এটি','ওই','সেই','এবং','হলো','হল','করে','করা','পাঠ','লেখো','লেখ','বলো','উল্লেখ','কর','দাও','মধ্যে','কোনটি','কোনটা','প্রসঙ্গ','প্রসঙ্গে','উদ্ধৃত']);

function norm(s){
  s = String(s == null ? '' : s).normalize('NFC');
  s = s.replace(/[\u200b-\u200d\u2060\ufeff]/g, '');
  s = s.replace(/\u09DC/g, '\u09A1\u09BC').replace(/\u09DD/g, '\u09A2\u09BC').replace(/\u09DF/g, '\u09AF\u09BC');
  s = s.replace(PUNCT_RE, ' ');
  return s.replace(/\s+/g, ' ').trim().toLowerCase();
}
function bn(n){ return String(n).replace(/\d/g, function(d){ return '০১২৩৪৫৬৭৮৯'[+d]; }); }
function hasBn(s){ return /[\u0980-\u09FF]/.test(s); }

function splitSentences(text){
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let blank = true;
  const re = /[^।?!]+(?:[।?!]+["'”’)\]»]*)?|[।?!]+["'”’)\]»]*/g;
  for(let li = 0; li < lines.length; li++){
    const line = lines[li].trim();
    if(!line){ blank = true; if(out.length) out[out.length-1].na = true; continue; }
    const parts = line.match(re) || [line];
    let first = true;
    for(const p of parts){
      const t = p.trim();
      if(!t) continue;
      if(!first && !norm(t) && out.length){ out[out.length-1].t += ' ' + t; continue; }
      out.push({t: t, pb: first ? blank : false, na: false});
      first = false;
    }
    blank = false;
    const nxt = lines[li+1];
    if(nxt === undefined || !nxt.trim()){ if(out.length) out[out.length-1].na = true; }
  }
  return out;
}

const HEAD_P1 = /^\s*(?:#{1,6}\s*|={2,}\s*|\*{2,}\s*|\[+\s*)?(?:অধ্যায়|পাঠ|পরিচ্ছেদ|অনুচ্ছেদ|পর্ব|সর্গ|অঙ্ক|ইউনিট|একক|খণ্ড|খন্ড|chapter|unit|lesson|part)\s*[-–—:ঃ.]?\s*[০-৯0-9IVXivx]*\s*(?:[-–—:ঃ.].*)?$/i;
const HEAD_P2 = /^\s*(?:#{1,6}\s+|={2,}|\*{2,}\s*\S|\[\[|\u3010).+/;
function cleanTitle(t){
  const c = t.replace(/^[\s#=*\[\u3010]+/, '').replace(/[\s=*\]\u3011]+$/, '').trim();
  return c || t.trim();
}
function isHeading(s, mode, re){
  const t = s.t;
  if(re && t.length <= 140 && re.test(t)) return true;
  if(mode === 'blank'){
    const n = norm(t);
    return t.length <= 50 && s.pb && s.na && !/[।?!,;]$/.test(t) && n.length > 0 && n.split(' ').length <= 8;
  }
  if(t.length > 90) return false;
  if(/[।?!]$/.test(t.replace(/[\]=*\u3011\s]+$/, ''))) return false;
  return HEAD_P1.test(t) || HEAD_P2.test(t);
}
function detectChapters(sents, bookName, mode, customRe){
  let re = null;
  if(customRe){ try{ re = new RegExp(customRe); }catch(e){ re = null; } }
  const ch = [];
  for(let i = 0; i < sents.length; i++){
    if(isHeading(sents[i], mode, re)) ch.push({title: cleanTitle(sents[i].t), start: i, h: true});
  }
  if(!ch.length || ch[0].start > 0) ch.unshift({title: bookName, start: 0, h: false});
  return ch;
}

function sentAt(starts, idxs, pos){
  let lo = 0, hi = starts.length - 1, ans = 0;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(starts[mid] <= pos){ ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return idxs[ans];
}

function prepare(book){
  const sents = splitSentences(book.text);
  for(const s of sents){ s.c = s.t.replace(/\s+/g, ' ').normalize('NFC'); s.n = norm(s.t); s.h = false; s.ch = 0; }
  let chapters = (book.chapters && book.chapters.length && book.cv === ENGINE_V) ? book.chapters : null;
  if(!chapters || chapters.some(function(c){ return c.start >= sents.length; })){
    chapters = detectChapters(sents, book.name, book.chapMode || 'pattern', book.chapRegex || '');
  }
  for(let k = 0; k < chapters.length; k++){
    const c = chapters[k];
    const end = k + 1 < chapters.length ? chapters[k+1].start : sents.length;
    if(sents[c.start]) sents[c.start].h = !!c.h;
    for(let i = c.start; i < end; i++) sents[i].ch = k;
  }
  let of = '', nf = '';
  const oS = [], oI = [], nS = [], nI = [];
  const wi = new Map();
  for(let i = 0; i < sents.length; i++){
    const s = sents[i];
    if(s.c){ if(of) of += ' '; oS.push(of.length); oI.push(i); s.o = of.length; of += s.c; }
    if(s.n){
      if(nf) nf += ' ';
      nS.push(nf.length); nI.push(i); s.no = nf.length; nf += s.n;
      s.w = s.n.split(' ');
      const seen = new Set();
      for(const w of s.w){
        if(seen.has(w)) continue;
        seen.add(w);
        let a = wi.get(w);
        if(!a){ a = []; wi.set(w, a); }
        a.push(i);
      }
    } else { s.w = []; }
  }
  return {sents: sents, chapters: chapters, of: of, nf: nf, oS: oS, oI: oI, nS: nS, nI: nI, wi: wi, tri: null};
}

function triIndex(prep){
  if(prep.tri) return prep.tri;
  const m = new Map();
  const maxHits = Math.max(30, Math.floor(prep.sents.length * 0.1));
  for(let i = 0; i < prep.sents.length; i++){
    const s = prep.sents[i];
    const x = s.x || (s.x = s.n.replace(/ /g, ''));
    for(let k = 0; k + 2 < x.length; k++){
      const key = (x.charCodeAt(k) * 65536 + x.charCodeAt(k+1)) * 65536 + x.charCodeAt(k+2);
      let a = m.get(key);
      if(!a){ m.set(key, [i]); }
      else if(a.length < maxHits && a[a.length - 1] !== i){ a.push(i); }
    }
  }
  prep.tri = m;
  return m;
}


function longestRun(a, b){
  let best = 0;
  let prev = new Array(b.length + 1).fill(0);
  for(let i = 1; i <= a.length; i++){
    const cur = new Array(b.length + 1).fill(0);
    for(let j = 1; j <= b.length; j++){
      if(a[i-1] === b[j-1]){ cur[j] = prev[j-1] + 1; if(cur[j] > best) best = cur[j]; }
    }
    prev = cur;
  }
  return best;
}

function approxSim(q, s){
  const m = q.length, n = s.length;
  if(!m || !n) return 0;
  let prev = new Uint16Array(n + 1);
  let cur = new Uint16Array(n + 1);
  for(let i = 1; i <= m; i++){
    cur[0] = i;
    const qc = q.charCodeAt(i-1);
    for(let j = 1; j <= n; j++){
      const cost = qc === s.charCodeAt(j-1) ? 0 : 1;
      let v = prev[j-1] + cost;
      const del = prev[j] + 1;
      const ins = cur[j-1] + 1;
      if(del < v) v = del;
      if(ins < v) v = ins;
      cur[j] = v;
    }
    const t = prev; prev = cur; cur = t;
  }
  let min = m;
  for(let j = 0; j <= n; j++){ if(prev[j] < min) min = prev[j]; }
  return Math.max(0, 1 - min / m);
}

const WRAP_ONLY = /^[\s"'“”‘’«»()\[\]।!?.,;:\-–—…]*$/;
function searchBook(prep, q, opts){
  opts = opts || {};
  const sents = prep.sents;
  const N = sents.length;
  const best = new Map();
  const add = function(si, ei, type, score){
    const k = si + ':' + ei;
    const o = best.get(k);
    if(!o || o.score < score) best.set(k, {si: si, ei: ei, type: type, score: score});
  };
  const qc = String(q).normalize('NFC').replace(/\s+/g, ' ').trim();
  const qn = norm(q);
  if(qn.length < 2) return [];
  const pen = qn.length < 6 ? 25 : (qn.length < 12 ? 15 : 0);
  let top = 0;

  const qs = qc.replace(/^[\s"'“”‘’«».,;:!?।\-–—…]+|[\s"'“”‘’«».,;:!?।\-–—…]+$/g, '');
  if(qs.length >= 2 && prep.of){
    let from = 0, cnt = 0;
    while(cnt < 60){
      const p = prep.of.indexOf(qs, from);
      if(p < 0) break;
      cnt++; from = p + 1;
      const si = sentAt(prep.oS, prep.oI, p);
      const ei = sentAt(prep.oS, prep.oI, p + qs.length - 1);
      const before = prep.of.slice(sents[si].o, p);
      const after = prep.of.slice(p + qs.length, sents[ei].o + sents[ei].c.length);
      const whole = WRAP_ONLY.test(before) && WRAP_ONLY.test(after);
      const sc = whole ? 100 : Math.max(60, 97 - pen);
      add(si, ei, 'exact', sc);
      if(sc > top) top = sc;
    }
  }
  if(top < 98 && prep.nf){
    let from = 0, cnt = 0;
    while(cnt < 60){
      const p = prep.nf.indexOf(qn, from);
      if(p < 0) break;
      cnt++; from = p + 1;
      const si = sentAt(prep.nS, prep.nI, p);
      const ei = sentAt(prep.nS, prep.nI, p + qn.length - 1);
      const whole = p === sents[si].no && (p + qn.length) === (sents[ei].no + sents[ei].n.length);
      const sc = whole ? 96 : Math.max(60, 92 - pen);
      add(si, ei, 'normalized', sc);
      if(sc > top) top = sc;
    }
  }

  if(top < 90){
    const qw = qn.split(' ').filter(Boolean);
    const qu = Array.from(new Set(qw));
    const cnt = new Map();
    for(const w of qu){
      const a = prep.wi.get(w);
      if(!a) continue;
      if(a.length > N * 0.25 && qu.length > 3) continue;
      for(const i of a) cnt.set(i, (cnt.get(i) || 0) + 1);
    }
    const need = qu.length <= 2 ? qu.length : Math.max(2, Math.ceil(qu.length * 0.4));
    const cands = Array.from(cnt.entries()).filter(function(e){ return e[1] >= need; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 50);
    for(const e of cands){
      const i = e[0], c = e[1];
      const run = longestRun(qw, sents[i].w);
      if(run < 2 && !(qw.length <= 2 && c === qu.length)) continue;
      const runFrac = run / qw.length;
      const contain = c / qu.length;
      let sc = Math.round(100 * (0.6 * runFrac + 0.4 * contain) * 0.95);
      if(sc > 89) sc = 89;
      if(sc >= 50){ add(i, i, 'partial', sc); if(sc > top) top = sc; }
    }
  }

  if(top < 80 && opts.fuzzy !== false){
    const x = qn.replace(/ /g, '');
    if(x.length >= 6){
      const tri = triIndex(prep);
      const keys = new Set();
      for(let k = 0; k + 2 < x.length; k++) keys.add((x.charCodeAt(k) * 65536 + x.charCodeAt(k+1)) * 65536 + x.charCodeAt(k+2));
      const cnt = new Map();
      keys.forEach(function(key){
        const a = tri.get(key);
        if(!a || a.length > N * 0.2) return;
        for(const i of a) cnt.set(i, (cnt.get(i) || 0) + 1);
      });
      const total = keys.size;
      const arr = Array.from(cnt.entries()).map(function(e){ return [e[0], e[1] / total]; }).filter(function(e){ return e[1] >= 0.25; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 30);
      for(const e of arr){
        const i = e[0];
        let sim = approxSim(x, sents[i].x);
        if(i + 1 < N && x.length > sents[i].x.length * 0.9){
          const s2 = approxSim(x, sents[i].x + sents[i+1].x);
          if(s2 > sim) sim = s2;
        }
        if(sim >= 0.72){
          let sc = Math.round(50 + (sim - 0.7) / 0.3 * 35);
          if(sc > 85) sc = 85;
          add(i, i, 'fuzzy', sc);
        }
      }
    }
  }
  return Array.from(best.values());
}


const QRE_SRC = '"([^"]{2,}?)"|\\u201c([^\\u201d]{2,}?)\\u201d|\\u2018([^\\u2019]{2,}?)\\u2019|\'([^\']{2,}?)\'|\\u00ab([^\\u00bb]{2,}?)\\u00bb';
const JUNK_Q = /(কোন|কোনো)\s*(অধ্যায়|পাঠ|গল্প|কবিতা|নাটক|প্রবন্ধ|উপন্যাস|অংশ)|থেকে\s*নেওয়া|নেওয়া\s*হয়েছে|লাইনটি|বাক্যটি|উক্তিটি/;

function fallbackQueries(raw){
  let s = raw.replace(/^\s*(?:প্রশ্ন|প্র|Q|Question)?\s*[\d০-৯]*\s*[.:ঃ)\-।]*\s*/i, '');
  s = s.replace(/["\u201c\u201d\u2018\u2019'\u00ab\u00bb]/g, '');
  const segs = s.split(/[—–:ঃ?।]|\s-\s/).map(function(x){ return x.trim(); }).filter(Boolean);
  const scored = segs.map(function(x){
    const ws = x.split(/\s+/).filter(function(w){ return hasBn(w); });
    const real = ws.filter(function(w){ return !STOPQ.has(norm(w)); });
    return {x: x, n: ws.length, r: real.length};
  }).filter(function(o){ return o.r >= 2 && o.r / o.n >= 0.5; }).sort(function(a, b){ return b.r - a.r; });
  const out = [];
  for(const o of scored){ if(out.length < 2) out.push(o.x); }
  if(!out.length && norm(s).length >= 4) out.push(s.trim());
  return out;
}

function extractQueries(raw){
  let s = String(raw).trim();
  const qc = /["\u201c\u201d\u2018\u2019\u00ab\u00bb]/g;
  if(/^["\u201c\u00ab]/.test(s) && /["\u201d\u00bb]$/.test(s)){
    const inner = s.slice(1, -1);
    if((inner.match(qc) || []).length >= 2) s = inner.trim();
  }
  const re = new RegExp(QRE_SRC, 'g');
  const found = [];
  let m;
  while((m = re.exec(s))){
    const t = (m[1] || m[2] || m[3] || m[4] || m[5] || '').trim();
    if(t) found.push(t);
  }
  const seen = new Set();
  const good = [];
  for(const t of found){
    if(!hasBn(t)) continue;
    if(/[:ঃ]\s*$/.test(t)) continue;
    if(/^(প্রশ্ন|প্র)\s*[\d০-৯]*\s*[:ঃ.]?$/.test(t)) continue;
    if(JUNK_Q.test(t)) continue;
    const k = norm(t);
    if(k.length < 2 || seen.has(k)) continue;
    seen.add(k);
    good.push(t);
  }
  const rest = s.replace(new RegExp(QRE_SRC, 'g'), ' ');
  if(good.length) return {queries: good, fallback: false, rest: rest};
  return {queries: fallbackQueries(s), fallback: true, rest: s};
}

function splitQuestions(text){
  const t = String(text || '').replace(/\r\n?/g, '\n').trim();
  if(!t) return [];
  const NUM = /^\s*(?:(?:প্রশ্ন|প্র|Q|Question)\s*)?[\d০-৯]+\s*[.)।:\-ঃ]\s*\S|^\s*(?:প্রশ্ন|Q)\s*[\d০-৯]*\s*[:ঃ]/i;
  const blocks = t.split(/\n\s*\n+/);
  const out = [];
  for(const b of blocks){
    const lines = b.split('\n').map(function(x){ return x.trimEnd(); }).filter(function(x){ return x.trim(); });
    if(lines.length <= 1){ if(lines[0]) out.push(lines[0].trim()); continue; }
    const numbered = lines.filter(function(l){ return NUM.test(l); }).length;
    if(numbered >= 2 || (numbered >= 1 && NUM.test(lines[0]))){
      let cur = null;
      for(const l of lines){
        if(NUM.test(l)){ if(cur !== null) out.push(cur.trim()); cur = l; }
        else cur = (cur === null ? '' : cur + ' ') + l.trim();
      }
      if(cur !== null) out.push(cur.trim());
    } else {
      const withQ = lines.filter(function(l){ return /["\u201c\u201d\u2018\u2019\u00ab\u00bb']/.test(l); }).length;
      if(withQ === lines.length) lines.forEach(function(l){ out.push(l.trim()); });
      else out.push(lines.join(' ').trim());
    }
  }
  return out.filter(function(x){ return x.length >= 2; });
}

function ctxWordsOf(rest){
  const ws = norm(rest).split(' ').filter(function(w){ return w.length > 2 && hasBn(w) && !STOPQ.has(w); });
  return Array.from(new Set(ws));
}

function matchQuestion(raw, items, opt, customQueries){
  const ex = customQueries && customQueries.length ? {queries: customQueries, fallback: false, rest: raw} : extractQueries(raw);
  const ctxN = opt.ctxN || 2;
  const merged = new Map();
  for(const it of items){
    for(const q of ex.queries){
      const res = searchBook(it.prep, q, {fuzzy: opt.fuzzy !== false});
      for(const r of res){
        const key = it.book.id + '|' + r.si + '|' + r.ei;
        const o = merged.get(key);
        if(!o || o.score < r.score) merged.set(key, {it: it, q: q, si: r.si, ei: r.ei, type: r.type, score: r.score});
      }
    }
  }
  const cw = ctxWordsOf(ex.rest);
  const arr = Array.from(merged.values()).filter(function(m){ return m.score >= 50; });
  for(const m of arr){
    if(!cw.length){ m.ctx = null; continue; }
    const p = m.it.prep;
    const lo = Math.max(0, m.si - 3), hi = Math.min(p.sents.length - 1, m.ei + 3);
    let win = norm(m.it.book.name) + ' ' + norm(p.chapters[p.sents[m.si].ch].title);
    for(let i = lo; i <= hi; i++) win += ' ' + p.sents[i].n;
    let hits = 0;
    for(const w of cw){ if(win.indexOf(w) >= 0) hits++; }
    m.ctx = Math.round(100 * hits / cw.length);
  }
  const rank = function(m){ return m.score + (m.ctx || 0) * 0.03; };
  arr.sort(function(a, b){ return (rank(b) - rank(a)) || (a.it.book.name < b.it.book.name ? -1 : a.it.book.name > b.it.book.name ? 1 : 0) || (a.si - b.si); });
  const LIM = 12;
  const cands = arr.slice(0, LIM).map(function(m){
    const p = m.it.prep, ss = p.sents;
    const chapIdx = ss[m.si].ch;
    const matched = [];
    for(let i = m.si; i <= m.ei; i++) matched.push(ss[i].t);
    const before = [], after = [];
    for(let i = Math.max(0, m.si - ctxN); i < m.si; i++) before.push(ss[i].t);
    for(let i = m.ei + 1; i <= Math.min(ss.length - 1, m.ei + ctxN); i++) after.push(ss[i].t);
    return {bid: m.it.book.id, bname: m.it.book.name, si: m.si, ei: m.ei, type: m.type, score: m.score, q: m.q, chapIdx: chapIdx, chap: p.chapters[chapIdx].title, matched: matched.join(' '), before: before, after: after, ctx: m.ctx};
  });
  return {queries: ex.queries, fallback: ex.fallback, cands: cands, more: Math.max(0, arr.length - LIM)};
}

function fileKey(c, split){ return split ? (c.bid + '#' + c.chapIdx) : c.bid; }

function decide(cands, opt){
  if(!cands.length) return {status: 'unmatched'};
  if(cands[0].score < opt.reviewThr) return {status: 'unmatched'};
  const strong = cands.filter(function(c){ return c.score >= opt.autoThr; });
  if(strong.length){
    const rivalThr = Math.min(opt.autoThr, 85);
    const files = new Set(cands.filter(function(c){ return c.score >= rivalThr; }).map(function(c){ return fileKey(c, opt.splitCh); }));
    if(files.size === 1) return opt.autoSave ? {status: 'saved', pick: cands.indexOf(strong[0])} : {status: 'review'};
    return {status: 'ambiguous'};
  }
  return {status: 'review'};
}

function getRepeatInfo(raw, entries){
  const k = norm(raw);
  if(!k || !entries) return { count: 1, stars: '' };
  const count = entries.filter(function(x){ return norm(x.e ? x.e.raw : x.raw) === k; }).length;
  const stars = count > 1 ? '⭐'.repeat(count - 1) : '';
  return { count: count, stars: stars };
}





/* ---------- IndexedDB ---------- */
let DB = null;
function dbOpen(){
  return new Promise(function(res, rej){
    if(!window.indexedDB){ rej(new Error('IndexedDB পাওয়া যায়নি')); return; }
    const r = indexedDB.open('bqm_db', 1);
    r.onupgradeneeded = function(){
      const d = r.result;
      ['books', 'analyses', 'qs'].forEach(function(n){ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath: 'id'}); });
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath: 'k'});
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.onblocked = function(){ rej(new Error('ডেটাবেস ব্লকড')); };
  });
}
function dbAll(store){
  return new Promise(function(res, rej){
    const q = DB.transaction(store, 'readonly').objectStore(store).getAll();
    q.onsuccess = function(){ res(q.result || []); };
    q.onerror = function(){ rej(q.error); };
  });
}
function dbPutMany(store, arr){
  return new Promise(function(res, rej){
    const tx = DB.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    arr.forEach(function(o){ os.put(o); });
    tx.oncomplete = function(){ res(true); };
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error || new Error('abort')); };
  });
}
function dbDelMany(store, ids){
  return new Promise(function(res, rej){
    const tx = DB.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    ids.forEach(function(id){ os.delete(id); });
    tx.oncomplete = function(){ res(true); };
    tx.onerror = function(){ rej(tx.error); };
    tx.onabort = function(){ rej(tx.error || new Error('abort')); };
  });
}
function dbClear(store){
  return new Promise(function(res, rej){
    const tx = DB.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = function(){ res(true); };
    tx.onerror = function(){ rej(tx.error); };
  });
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(function(){ return true; }).catch(function(){ return legacyCopy(t); });
  }
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t){
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}

function saveTextFile(name, text, mime, bom){

function safeName(n){ return String(n).replace(/[\\\/:*?"<>|]/g, '_'); }
function hash(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36) + '_' + s.length; }
function readFileText(f){
  return new Promise(function(res, rej){
    const r = new FileReader();

function getPrep(b){

function checkName(v, selfId){
  v = (v || '').trim();
  if(!v) return 'নাম লিখুন';
  if(v.length > 60) return 'নাম ৬০ অক্ষরের মধ্যে রাখুন';
  if(/[\\\/:*?"<>|]/.test(v)) return 'এই চিহ্নগুলো ব্যবহার করা যাবে না: \\ / : * ? " < > |';
  const k = v.toLowerCase();
  if(S.books.some(function(b){ return b.id !== selfId && b.name.toLowerCase() === k; })) return 'এই নামে আরেকটি ফাইল আছে — অন্য নাম দিন';
  return null;
}
function uniqueDefault(n){
  n = safeName(n).trim().slice(0, 56) || 'Textbook';
  let c = n, i = 2;
  while(checkName(c, null)){ c = n + ' (' + i + ')'; i++; if(i > 200) break; }
  return c;
}
function makeBook(name, text, h){

  const p = prepare(b);

async function importFiles(files){
  if(!files.length) return;
  let autoBatch = false;
  if(files.length > 1){
    autoBatch = await askConfirm(bn(files.length) + ' টি ফাইল নির্বাচন করা হয়েছে।\n\nফাইলগুলোর নাম অনুযায়ী স্বয়ংক্রিয়ভাবে সবগুলো বই একবারে যুক্ত করতে চান?', 'একবারে যুক্ত করুন');
  }
  const newBooks = [];
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    let text;
    try{ text = await readFileText(f); }catch(e){ toast('পড়া যায়নি: ' + f.name, 'bad'); continue; }
    text = text.replace(/^\ufeff/, '');
    if(!text.trim()){ toast('ফাইলটি খালি: ' + f.name, 'bad'); continue; }
    const bad = (text.match(/\ufffd/g) || []).length;
    if(bad > Math.max(5, text.length * 0.002)){
      const ok = await askConfirm('"' + f.name + '" UTF-8 এনকোডিংয়ে নেই বলে মনে হচ্ছে (অনেক ভাঙা অক্ষর আছে)। তবুও যুক্ত করবেন?', 'তবুও যুক্ত করুন');
      if(!ok) continue;
    }
    const h = hash(text);
    const same = S.books.concat(newBooks).find(function(b){ return b.hash === h; });
    if(same){
      if(autoBatch){
        toast('বাদ দেওয়া হয়েছে (আগে থেকেই আছে): ' + f.name, 'bad');
        continue;
      }
      const ok = await askConfirm('এই ফাইলের অবিকল কপি "' + same.name + '" নামে আগেই আছে। আবার যুক্ত করবেন?', 'হ্যাঁ, যুক্ত করুন');
      if(!ok) continue;
    }
    let name = uniqueDefault(f.name.replace(/\.[^.]+$/, ''));
    if(!autoBatch){
      name = await askInput('বইয়ের নাম দিন', 'এই TXT ফাইলের জন্য একটি নাম (যেমন: Abhishek)', name, {validate: function(v){ return checkName(v, null); }});
      if(name === null) continue;
    }
    busyShow('ফাইল প্রস্তুত হচ্ছে… (' + bn(i + 1) + ' / ' + bn(files.length) + ')'); await tick();
    const b = makeBook(name, text, h);
    S.books.push(b);
    newBooks.push(b);
  }
  if(newBooks.length){
    busyShow('সংরক্ষণ হচ্ছে…'); await tick();
    const ok = await save('books', newBooks);
    busyHide();
    toast(ok ? bn(newBooks.length) + ' টি বই সফলভাবে যুক্ত হয়েছে' : 'যুক্ত হয়েছে কিন্তু সংরক্ষণ ব্যর্থ', ok ? 'ok' : 'bad');
    render(true);
  } else {
    busyHide();
  }
}

/* ---------- ম্যাচিং ব্যাচ ---------- */
function matchOpt(){ const s = S.settings; return {autoThr: s.autoThr, reviewThr: s.reviewThr, splitCh: s.splitCh, autoSave: s.autoSave, ctxN: s.ctxN, fuzzy: s.fuzzy}; }
function newRec(raw, key, batch){
  return {id: 'q' + uid(), seq: ++S.seq, batch: batch, raw: raw, key: key, createdAt: Date.now(), queries: [], fallback: false, cands: [], more: 0, status: 'unmatched', chosen: [], dupOf: null, repeat: false};
}
function commitEntry(rec, ci){
  const c = rec.cands[ci];
  const split = S.settings.splitCh;
  const fk = fileKey(c, split);
  const aid = 'a_' + fk;
  let a = S.analyses.find(function(x){ return x.id === aid; });
  if(!a){
    const book = S.books.find(function(b){ return b.id === c.bid; });
    const bname = book ? book.name : c.bname;
    const ct = (split && c.chap !== bname) ? c.chap : null;
    a = {id: aid, bookId: c.bid, chapTitle: ct, name: analysisName(bname, ct), entries: [], createdAt: Date.now(), updatedAt: Date.now()};
    S.analyses.push(a);
  }
  if(!a.entries.some(function(e){ return e.qid === rec.id && e.ci === ci; })){
    const others = rec.cands.filter(function(x, i){ return i !== ci && x.score >= 80; }).length;
    a.entries.push({id: rec.id + ':' + ci, qid: rec.id, ci: ci, seq: rec.seq, raw: rec.raw, quoted: c.q, book: c.bname, chapter: c.chap, matched: c.matched, before: c.before.slice(), after: c.after.slice(), type: c.type, score: c.score, repeat: !!rec.repeat, others: others, addedAt: Date.now(), note: ''});
    a.entries.sort(function(x, y){ return (x.seq - y.seq) || (x.ci - y.ci); });
    a.updatedAt = Date.now();
  }
  if(rec.chosen.indexOf(ci) < 0) rec.chosen.push(ci);
  rec.status = 'saved';
  S.dirtyA.add(a.id);
  return a;
}
function dropQEntries(qid){
  for(const a of S.analyses.slice()){
    const n = a.entries.length;
    a.entries = a.entries.filter(function(e){ return e.qid !== qid; });
    if(a.entries.length !== n){
      a.updatedAt = Date.now();
      if(!a.entries.length){
        S.analyses = S.analyses.filter(function(x){ return x !== a; });
        S.dirtyA.delete(a.id); S.delA.add(a.id);
        if(S.openA === a.id) S.openA = null;
      } else S.dirtyA.add(a.id);
    }
  }
}
function fillMatch(rec, items, custom){
  const r = matchQuestion(rec.raw, items, matchOpt(), custom);
  rec.queries = r.queries; rec.fallback = r.fallback; rec.cands = r.cands; rec.more = r.more; rec.chosen = [];
  const d = decide(r.cands, matchOpt());
  rec.status = d.status;
  if(d.status === 'saved') commitEntry(rec, d.pick);
}
function buildItems(){
  return S.books.map(function(b){ return {book: {id: b.id, name: b.name}, prep: getPrep(b)}; });
}
async function runBatch(text){
  const list = splitQuestions(text);
  if(!list.length){ toast('কোনো প্রশ্ন পাওয়া যায়নি', 'bad'); return false; }
  if(!S.books.length){ toast('লাইব্রেরিতে কোনো TXT নেই', 'bad'); return false; }
  busyShow('বই প্রস্তুত হচ্ছে…'); await tick();
  const items = [];
  for(const b of S.books){
    const p = getPrep(b);
    if(!b.chapters){ b.chapters = p.chapters; b.cv = ENGINE_V; }
    items.push({book: {id: b.id, name: b.name}, prep: p});
    await tick();
  }
  S.batch++;
  const batch = S.batch;
  const newRecs = [];
  for(let i = 0; i < list.length; i++){
    busyShow('ম্যাচিং চলছে… ' + bn(i + 1) + ' / ' + bn(list.length)); await tick();
    const raw = list[i];
    const key = norm(raw);
    const rec = newRec(raw, key, batch);
    fillMatch(rec, items);
    newRecs.push(rec);
    if(i % 8 === 7) await tick();
  }
  S.qs = S.qs.concat(newRecs);
  busyShow('সংরক্ষণ হচ্ছে…'); await tick();
  await save('qs', newRecs);
  await flushA();
  await saveMeta();
  busyHide();
  return true;
}

async function rematch(rec, custom, asRepeat){
  busyShow('ম্যাচিং চলছে…'); await tick();
  const items = buildItems();
  if(asRepeat) rec.repeat = true;
  fillMatch(rec, items, custom);
  await save('qs', rec);
  await flushA();
  busyHide();
}

function qCardHtml(rec){
  let chap = '';
  if(rec.chosen && rec.chosen.length && rec.cands && rec.cands[rec.chosen[0]]){
    chap = rec.cands[rec.chosen[0]].chap;
  } else if(rec.cands && rec.cands.length){
    chap = rec.cands[0].chap;
  } else if(rec.dupOf){
    const prev = S.qs.find(function(x){ return x.id === rec.dupOf; });
    if(prev){
      if(prev.chosen && prev.chosen.length && prev.cands && prev.cands[prev.chosen[0]]){
        chap = prev.cands[prev.chosen[0]].chap;
      } else if(prev.cands && prev.cands.length){
        chap = prev.cands[0].chap;
      }
    }
  }
  return chap || 'অধ্যায় পাওয়া যায়নি';
}




function filteredQs(){
  const f = S.rf;
  let a = S.qs.slice();
  const maxBatch = S.qs.reduce(function(m, q){ return Math.max(m, q.batch || 0); }, 0);
  const curBatch = (S.batch && S.batch > 0) ? S.batch : maxBatch;
  if(f === 'batch') a = a.filter(function(x){ return x.batch === curBatch; });
  else if(f === 'no_chap') a = a.filter(function(x){ return qCardHtml(x) === 'অধ্যায় পাওয়া যায়নি'; });
  else if(f !== 'all') a = a.filter(function(x){ return x.status === f; });
  a.sort(function(x, y){ return f === 'batch' ? x.seq - y.seq : y.seq - x.seq; });
  return a;
}

}


function sortedEntries(a){
  return a.entries.slice().sort(function(x, y){ return (x.seq - y.seq) || (x.ci - y.ci); }).map(function(e, i){ return {e: e, serial: i + 1}; });
}

    '<select class="inp" id="as">' + sel('seq', S.as, 'ইনপুট ক্রম') + sel('seqd', S.as, 'উল্টো ক্রম') + sel('score', S.as, 'Confidence (বেশি→কম)') + sel('chap', S.as, 'অধ্যায় অনুযায়ী') + '</select></div>' +
    (chaps.length > 1 ? '<select class="inp" id="ac" style="margin-top:6px">' + sel('all', S.ac, 'সব অধ্যায়') + chaps.map(function(c){ return sel(c, S.ac, c); }).join('') + '</select>' : '') + '</div>' +
    '<div id="alist">' + entriesHtml(a) + '</div>';
}


function entriesHtml(a){
  let arr = sortedEntries(a);
  const q = norm(S.aq);
  if(q) arr = arr.filter(function(x){ return norm(x.e.raw).indexOf(q) >= 0; });
  if(S.as === 'seqd') arr.reverse();
  if(!arr.length) return '<div class="empty">কিছু পাওয়া যায়নি।</div>';

  let displayList = [];
  if(S.groupDups){
    const counts = new Map();
    arr.forEach(function(x){
      const k = norm(x.e.raw);
      counts.set(k, (counts.get(k) || 0) + 1);
    });
    const seen = new Set();
    arr.forEach(function(x){
      const k = norm(x.e.raw);
      if(!seen.has(k)){
        seen.add(k);
        const total = counts.get(k) || 1;
        displayList.push({ e: x.e, stars: total > 1 ? '⭐'.repeat(total - 1) : '' });
      }
    });
  } else {
    displayList = arr.map(function(x){ return { e: x.e, stars: '' }; });
  }

  let h = displayList.slice(0, S.aLimit).map(function(item, idx){
    const starBadge = item.stars ? '<span style="margin-left:6px;letter-spacing:1px" title="পুনরাবৃত্ত কপি">' + item.stars + '</span>' : '';
    return '<div class="card" style="padding:6px 10px;margin-bottom:4px;line-height:1.4"><span class="qno" style="font-weight:700;margin-right:6px">' + bn(idx + 1) + '.</span>' + esc(item.e.raw) + starBadge + '</div>';
  }).join('');

  if(displayList.length > S.aLimit) h += '<div class="btnrow"><button class="btn" data-act="moreA">আরও দেখান</button></div>';
  return h;
}



function analysisText(a){
  const es = sortedEntries(a);
  let t = '';
  if(S.groupDups){
    const counts = new Map();
    es.forEach(function(x){
      const k = norm(x.e.raw);
      counts.set(k, (counts.get(k) || 0) + 1);
    });
    const seen = new Set();
    let idx = 1;
    es.forEach(function(x){
      const k = norm(x.e.raw);
      if(!seen.has(k)){
        seen.add(k);
        const total = counts.get(k) || 1;
        const star = total > 1 ? ' ' + '⭐'.repeat(total - 1) : '';
        t += bn(idx) + '. ' + x.e.raw + star + '\n';
        idx++;
      }
    });
  } else {
    es.forEach(function(x, idx){
      t += bn(idx + 1) + '. ' + x.e.raw + '\n';
    });
  }
  return t.trim();
}

    '<div class="card"><b>সংরক্ষণের অবস্থা</b><div class="mut small">ডেটাবেস: ' + (S.dbOk ? 'চালু ✓ (IndexedDB)' : '<span style="color:var(--bad)">বন্ধ — ডেটা স্থায়ী হবে না, ব্যাকআপ নিন</span>') +

    '<br>বই ' + bn(S.books.length) + ' · অ্যানালাইসিস ফাইল ' + bn(S.analyses.length) + ' · প্রশ্ন ' + bn(S.qs.length) + '</div></div>' +
    '<div class="card"><b>বিপজ্জনক অংশ</b><div class="btnrow"><button class="btn dng" data-act="wipe">সব ডেটা মুছুন</button></div></div>';

function render(keep){
  const titles = {lib: 'টেক্সটবুক লাইব্রেরি', match: 'প্রশ্ন ম্যাচার', results: 'ম্যাচ রেজাল্ট', analysis: 'অ্যানালাইসিস লাইব্রেরি', settings: 'সেটিংস ও ব্যাকআপ'};

  $('#pgTitle').textContent = titles[S.view];
  const v = $('#view');

  const fn = {lib: vLib, match: vMatch, results: vResults, analysis: vAnalysis, settings: vSettings}[S.view];

}

const ACT = {

  runMatch: async function(){

  pick: async function(el){

  repick: async function(el){

    rec.status = rec.cands.length && rec.cands[0].score >= S.settings.reviewThr ? 'review' : 'unmatched';
    await save('qs', rec); await flushA();
    toast('আবার বাছাইয়ের জন্য খোলা হয়েছে', 'ok');
    render(true);
  },
  goFile: function(el){
    const rec = S.qs.find(function(q){ return q.id === el.dataset.id; });
    const c = rec.cands[rec.chosen[0]];
    const a = S.analyses.find(function(x){ return x.entries.some(function(e){ return e.qid === rec.id; }); });
    if(a){ S.openA = a.id; S.aq = norm(rec.raw).slice(0, 0); S.view = 'analysis'; render(false); }
    else toast('ফাইল পাওয়া যায়নি: ' + (c ? c.bname : ''), 'bad');
  },
  delQ: async function(el){
    const rec = S.qs.find(function(q){ return q.id === el.dataset.id; });
    if(!await askConfirm('এই প্রশ্নটি মুছবেন? অ্যানালাইসিস ফাইল থেকেও এন্ট্রি সরে যাবে।', 'মুছুন', true)) return;
    dropQEntries(rec.id);
    S.qs = S.qs.filter(function(q){ return q.id !== rec.id; });
    await removeFromDb('qs', [rec.id]); await flushA();
    render(true);
  },
  addDup: async function(el){
    const rec = S.qs.find(function(q){ return q.id === el.dataset.id; });

    toast('আলাদা এন্ট্রি হিসেবে বিশ্লেষিত', 'ok');

  },
  research: async function(el){

  openA: function(el){ S.openA = el.dataset.id; S.aq = ''; S.af = 'all'; S.as = 'seq'; S.ac = 'all'; S.aLimit = 80; render(false); },
  backA: function(){ S.openA = null; render(false); },

  expA: function(el){ const a = S.analyses.find(function(x){ return x.id === el.dataset.id; }); saveTextFile(safeName(a.name) + '.txt', analysisText(a), 'text/plain'); },
  copyA: async function(el){ const a = S.analyses.find(function(x){ return x.id === el.dataset.id; }); const ok = await copyText(analysisText(a)); if(ok) toast('সম্পূর্ণ অ্যানালাইসিস কপি হয়েছে', 'ok'); else showTextModal(a.name, analysisText(a)); },
    viewA: function(el){ const a = S.analyses.find(function(x){ return x.id === el.dataset.id; }); showTextModal(a.name, analysisText(a)); },
    togGroupDups: function(){
    S.groupDups = !S.groupDups;
    const a = S.analyses.find(function(x){ return x.id === S.openA; });
    if(a) $('#alist').innerHTML = entriesHtml(a);
    render(true);
    toast(S.groupDups ? '⭐ পুনরাবৃত্ত কপি লুকানো ও স্টার প্রদর্শন সক্রিয়' : 'সব প্রশ্ন সম্পূর্ণ প্রদর্শন সক্রিয়', 'ok');
  },

  delA: async function(el){

    const a = S.analyses.find(function(x){ return x.id === el.dataset.id; });
    if(!await askConfirm('"' + a.name + '" ফাইল মুছবেন? এর ' + bn(a.entries.length) + ' টি প্রশ্ন সরে যাবে।', 'মুছুন', true)) return;
    const qids = new Set(a.entries.map(function(e){ return e.qid; }));
    qids.forEach(function(id){ dropQEntries(id); });
    const gone = [];
    S.qs = S.qs.filter(function(q){ if(qids.has(q.id) && !S.analyses.some(function(x){ return x.entries.some(function(e){ return e.qid === q.id; }); })){ gone.push(q.id); return false; } return true; });
    await removeFromDb('qs', gone); await flushA();
    S.openA = null;
    render(false);
  },
  editE: function(el){
    const a = S.analyses.find(function(x){ return x.id === el.dataset.a; });

        e.quoted = m.querySelector('#eQ').value.trim() || e.quoted;
        e.note = m.querySelector('#eN').value.trim();
        a.updatedAt = Date.now(); S.dirtyA.add(a.id);

      }}]});
  },
  delE: async function(el){
    const a = S.analyses.find(function(x){ return x.id === el.dataset.a; });
    const e = a.entries.find(function(x){ return x.id === el.dataset.id; });
    if(!await askConfirm('এই এন্ট্রি মুছবেন?', 'মুছুন', true)) return;
    a.entries = a.entries.filter(function(x){ return x !== e; });
    a.updatedAt = Date.now();
    const rec = S.qs.find(function(q){ return q.id === e.qid; });
    if(rec){
      rec.chosen = rec.chosen.filter(function(ci){ return ci !== e.ci; });
      if(!rec.chosen.length){ S.qs = S.qs.filter(function(q){ return q !== rec; }); await removeFromDb('qs', [rec.id]); }
      else await save('qs', rec);
    }
    if(!a.entries.length){ S.analyses = S.analyses.filter(function(x){ return x !== a; }); S.delA.add(a.id); S.openA = null; }
    else S.dirtyA.add(a.id);
    await flushA();
    render(true);

  bkExport: function(){

    saveTextFile('QMatcher_Backup_' + stamp + '.json', JSON.stringify(obj), 'application/json', false);
  },
  bkImport: function(){ $('#fileBackup').click(); },
  wipe: async function(){
    if(!await askConfirm('সব বই, অ্যানালাইসিস ফাইল ও প্রশ্ন মুছে যাবে। আগে ব্যাকআপ নিয়েছেন?', 'এগিয়ে যান', true)) return;
    if(!await askConfirm('সত্যিই সব মুছবেন? এটি ফেরানো যাবে না।', 'হ্যাঁ, সব মুছুন', true)) return;
    try{ for(const st of ['books', 'analyses', 'qs']) await dbClear(st); }catch(e){ toast('মুছতে ব্যর্থ', 'bad'); return; }
    S.books = []; S.analyses = []; S.qs = []; S.prepCache.clear(); S.openA = null;
    setChip('ok', 'সংরক্ষিত  ' + nowStr());
    toast('সব ডেটা মুছে গেছে', 'ok');
    render(false);
  }
};

async function restoreBackup(file){
  let obj;
  try{ obj = JSON.parse((await readFileText(file)).replace(/^\ufeff/, '')); }catch(e){ toast('JSON পড়া যায়নি', 'bad'); return; }
  if(!obj || obj.app !== 'bqm' || !Array.isArray(obj.books)){ toast('এটি এই অ্যাপের ব্যাকআপ ফাইল নয়', 'bad'); return; }
  const mode = await askChoice('পুনরুদ্ধার', 'ব্যাকআপে আছে: বই ' + bn(obj.books.length) + ', অ্যানালাইসিস ' + bn((obj.analyses || []).length) + ', প্রশ্ন ' + bn((obj.qs || []).length) + '।\n\nপ্রতিস্থাপন: বর্তমান সব ডেটা মুছে ব্যাকআপ বসবে।\nমার্জ: বর্তমান ডেটা রেখে নতুনগুলো যোগ হবে।', [{label: 'বাতিল', val: null}, {label: 'মার্জ', val: 'merge'}, {label: 'প্রতিস্থাপন', val: 'replace', cls: 'dng'}]);
  if(!mode) return;
  busyShow('পুনরুদ্ধার হচ্ছে…'); await tick();
  try{
    if(mode === 'replace'){
      for(const st of ['books', 'analyses', 'qs']) await dbClear(st);
      S.books = obj.books; S.analyses = obj.analyses || []; S.qs = obj.qs || [];
      S.settings = Object.assign({}, DEFAULTS, obj.settings || {});
      S.seq = obj.seq || 0; S.batch = obj.batch || 0;
    } else {
      const names = new Set(S.books.map(function(b){ return b.name.toLowerCase(); }));
      const ids = new Set(S.books.map(function(b){ return b.id; }));
      obj.books.forEach(function(b){
        if(ids.has(b.id)) return;
        let n = b.name, i = 2;
        while(names.has(n.toLowerCase())){ n = b.name + ' (' + i + ')'; i++; }
        if(n !== b.name){ b.name = n; }
        names.add(n.toLowerCase()); S.books.push(b);
      });
      (obj.analyses || []).forEach(function(a){
        const ex = S.analyses.find(function(x){ return x.id === a.id; });
        if(!ex){ S.analyses.push(a); return; }
        const have = new Set(ex.entries.map(function(e){ return e.id; }));
        a.entries.forEach(function(e){ if(!have.has(e.id)) ex.entries.push(e); });
        ex.entries.sort(function(x, y){ return (x.seq - y.seq) || (x.ci - y.ci); });
        ex.updatedAt = Math.max(ex.updatedAt, a.updatedAt);
      });
      const qi = new Set(S.qs.map(function(q){ return q.id; }));
      (obj.qs || []).forEach(function(q){ if(!qi.has(q.id)) S.qs.push(q); });
      S.seq = Math.max(S.seq, obj.seq || 0); S.batch = Math.max(S.batch, obj.batch || 0);
    }
    S.prepCache.clear();
    await save('books', S.books); await save('analyses', S.analyses); await save('qs', S.qs); await saveMeta();
    toast('পুনরুদ্ধার সম্পন্ন', 'ok');
  }catch(e){ toast('পুনরুদ্ধার ব্যর্থ: ' + (e && e.message ? e.message : e), 'bad'); }
  busyHide();
  render(false);
}

/* ---------- ইভেন্ট ---------- */
document.addEventListener('DOMContentLoaded', function(){
  $('#tabs').addEventListener('click', function(e){ const b = e.target.closest('button[data-v]'); if(b) go(b.dataset.v); });
  const view = $('#view');
  view.addEventListener('click', async function(e){
    const el = e.target.closest('[data-act]');
    if(!el || el.tagName === 'INPUT') return;
    const fn = ACT[el.dataset.act];
    if(!fn) return;
    try{ await fn(el, e); }catch(err){ busyHide(); toast('ত্রুটি: ' + (err && err.message ? err.message : err), 'bad'); }
  });
  view.addEventListener('change', async function(e){
    const t = e.target;
    if(t.tagName === 'INPUT' && t.dataset.act && ACT[t.dataset.act]){ try{ await ACT[t.dataset.act](t, e); }catch(err){ toast('ত্রুটি', 'bad'); } return; }
    if(t.dataset && t.dataset.set){
      const k = t.dataset.set;
      S.settings[k] = t.type === 'checkbox' ? t.checked : parseInt(t.value, 10);
      await saveMeta();
      return;
    }
    if(t.id === 'af' || t.id === 'as' || t.id === 'ac'){
      S[t.id] = t.value;
      const a = S.analyses.find(function(x){ return x.id === S.openA; });
      if(a) $('#alist').innerHTML = entriesHtml(a);
    }
  });
  view.addEventListener('input', function(e){
    const t = e.target;
    if(t.id === 'qInput'){ S.input = t.value; const c = $('#qCount'); if(c) c.textContent = qCountText(); }
    else if(t.id === 'aq'){ S.aq = t.value; S.aLimit = 80; const a = S.analyses.find(function(x){ return x.id === S.openA; }); if(a) $('#alist').innerHTML = entriesHtml(a); }
  });
  $('#fileTxt').addEventListener('change', async function(e){
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if(files.length) await importFiles(files);
  });
  $('#fileBackup').addEventListener('change', async function(e){
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if(f) await restoreBackup(f);
  });
  init();
});

async function init(){
  try{
    DB = await dbOpen();
    S.dbOk = true;
    const r = await Promise.all([dbAll('books'), dbAll('analyses'), dbAll('qs'), dbAll('meta')]);
    S.books = r[0]; S.analyses = r[1]; S.qs = r[2];
    r[3].forEach(function(m){
      if(m.k === 'settings') S.settings = Object.assign({}, DEFAULTS, m.v);
      else if(m.k === 'seq') S.seq = m.v;
      else if(m.k === 'batch') S.batch = m.v;
    });
    S.seq = Math.max(S.seq, S.qs.reduce(function(n, q){ return Math.max(n, q.seq || 0); }, 0));
    S.batch = Math.max(S.batch, S.qs.reduce(function(n, q){ return Math.max(n, q.batch || 0); }, 0));
    setChip('ok', 'সংরক্ষিত ');
    if(navigator.storage && navigator.storage.persist){ try{ S.persisted = await navigator.storage.persist(); }catch(e){ S.persisted = null; } }
  }catch(e){
    S.dbOk = false;
    setChip('bad', 'সংরক্ষণ বন্ধ');
    toast('ডেটাবেস চালু হয়নি — ডেটা স্থায়ী হবে না: ' + (e && e.message ? e.message : e), 'bad');
  }
  render(false);
}
</script>
